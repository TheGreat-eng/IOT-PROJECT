spring.application.name=smart-farm-backend

spring.datasource.url=jdbc:mysql://localhost:3306/smart_farm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

jwt.secret=SmartFarmSecretKey2024VeryLongAndSecureKeyForJWTTokenGenerationAtLeast256Bits
jwt.expiration=86400000

logging.level.root=INFO
logging.level.com.smartfarm=DEBUG
