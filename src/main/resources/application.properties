spring.application.name=smart-farm-backend

spring.datasource.url=jdbc:mysql://localhost:3307/smartfarm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thêm vào dòng spring.datasource.url
&characterEncoding=UTF-8&useUnicode=true

# Thêm 2 dòng này
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

server.port=8080

jwt.secret=SmartFarmSecretKey2024VeryLongAndSecureKeyForJWTTokenGenerationAtLeast256Bits
jwt.expiration=86400000

logging.level.root=INFO
logging.level.com.smartfarm=DEBUG


# ===================== INFLUXDB =====================
influxdb.url=${INFLUXDB_URL:http://localhost:8086}
influxdb.token=${INFLUXDB_TOKEN:my-super-secret-token}
influxdb.org=${INFLUXDB_ORG:smart-farm}
influxdb.bucket=${INFLUXDB_BUCKET:sensor-data}

# ===================== MQTT =====================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:smart-farm-server}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

# Nhiều topics có thể viết bằng cách đánh chỉ số:
mqtt.topics[0]=sensor/+/data
mqtt.topics[1]=device/+/status


# ============== Management endpoints ==============
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================== Logging =====================
logging.level.com.example.iotserver=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
